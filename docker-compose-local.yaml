# Varianta dockerizata pentru uz local, mereu pornita, FARA Caddy / TLS.
# Toate fisierele de deploy sunt in radacina repo-ului.
#
#   cp .env.example .env
#   docker compose -f docker-compose-local.yaml up -d --build
#
# Aplicatia: http://localhost:8990  (PFASIMPLU_PORT in .env)
#
# Loginul este obligatoriu: la prima deschidere creaza un cont in
# http://localhost:8990/conturi/inregistrare/ (sau foloseste /admin/).
#
# Baza de date, fisierele si logurile sunt direct pe gazda, in
# appdata/db, appdata/files si appdata/logs; se vad si se pot copia/backup-ui,
# si nu sunt afectate de rebuild-ul imaginii.
#
# "restart: unless-stopped" + serviciul Docker pornit la boot => aplicatia
# revine singura dupa restartul calculatorului (mai putin daca a fost oprita
# manual inainte).
#
# Codul sursa (./src) e montat live la /app/src, deci modificarile de cod nu
# necesita rebuild. Waitress nu face auto-reload: dupa editari reporneste
# containerul cu `make restart-local`. Schimbarile de dependinte
# (pyproject.toml / uv.lock) necesita in continuare `make build-local`.

services:
  pfasimplu-local:
    container_name: pfasimplu-local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PFASIMPLU_PORT:-8990}:8000"
    env_file:
      - .env
    volumes:
      # Toate datele (baza + fisiere) stau in ./appdata, montate la /data.
      - ./appdata:/data
      - ./staticfiles:/app/staticfiles
      # Codul sursa e montat live: modificarile din ./src nu necesita rebuild,
      # doar repornirea containerului (make restart-local).
      - ./src:/app/src
