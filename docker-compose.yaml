# Aplicatia PFASimplu (login obligatoriu, date izolate per cont) + Caddy (TLS) pentru VPS.
# Toate fisierele de deploy sunt in radacina repo-ului.
#
#   cp .env.prod.example .env.prod    # si completeaza valorile
#   docker compose -f docker-compose.yaml up -d --build
#
# Caddyfile-ul se monteaza din radacina; domeniul se seteaza in .env.prod
# (PFASIMPLU_DOMAIN) sau direct in Caddyfile.
#
# Codul sursa (./src) e montat live la /app/src, deci un `git pull` nu necesita
# rebuild pentru cod. Reporneste cu `make restart`; rebuild-ul (`make build`)
# ramane necesar doar cand se schimba dependintele sau Dockerfile-ul.

services:
  pfasimplu-app:
    container_name: pfasimplu-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env.prod
    volumes:
      # Datele raman pe gazda in ./appdata (db/, files/, logs/), si dupa rebuild.
      - ./appdata:/data
      - ./staticfiles:/app/staticfiles
      # Codul sursa e montat live: modificarile din ./src nu necesita rebuild,
      # doar repornirea containerului (make restart).
      - ./src:/app/src

  external-caddy-proxy:
    container_name: external-caddy-proxy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Ca sa foloseasca PFASIMPLU_DOMAIN din Caddyfile.
    env_file:
      - .env.prod
    volumes:
      - ./staticfiles:/webapp/staticfiles:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
