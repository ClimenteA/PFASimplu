[project]
name = "pfasimplu"
version = "3.0.5"
description = "Aplicatie de contabilitate pentru PFA-uri"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2.11",
    "django-cleanup>=8.1.0",
    "django-browser-reload>=1.13.0",
    "cursvalutarbnr>=1.0.6",
    "pandas>=3.1.1",
    "openpyxl>=3.1.5",
    "matplotlib>=3.9.2",
    "requests>=2.34.2",
    "pdf-oxide>=0.3.78",
    "cachetools>=5.5.0",
    "Unidecode>=1.3.8",
    "waitress>=3.0.1",
    "whitenoise>=6.7.0",
    "requests-cache>=1.3.3",
    "flaskwebgui>=1.1.9",
]

[project.scripts]
pfasimplu = "core.launcher:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

# Pachetele sunt top-level in src/. Hatchling elimina prefixul "src/" la
# construirea wheel-ului, deci in site-packages ajung core/, utils/ etc.
# Fisierele non-Python (templates/, static/) sunt copiate la radacina
# wheel-ului, exact unde le asteapta core/settings.py (BASE_DIR).
[tool.hatch.build.targets.wheel]
packages = [
    "src/core",
    "src/conturi",
    "src/setari",
    "src/facturi",
    "src/incasari",
    "src/cheltuieli",
    "src/documente",
    "src/inventar",
    "src/registre",
    "src/utils",
]

[tool.hatch.build.targets.wheel.force-include]
"src/templates" = "templates"
"src/static" = "static"

[dependency-groups]
dev = [
    "faker>=40.63.0",
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff >=0.17 activa toate regulile prin defect; pastram setul clasic ca
# `make check` sa verifice acelasi lucru in CI si local.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "RUF012",
    "BLE001",
    # Modele existente in cod, pastrate intentionat:
    "E402", # importuri dupa sys.path/django.setup() in testele Playwright
    "E731", # lambda atribuita in utils/github_data.py
    "E741", # variabila `l` in facturi/models.py
    "E722", # except: in utils/pretty_excel.py
]
