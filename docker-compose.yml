# Aplicatia PFASimplu (mod multi-user) pentru VPS.
# Proxy-ul TLS (Caddy) ruleaza separat - vezi docker-compose.caddy.yml.
#
#   docker network create web          # o singura data pe VPS
#   cp .env.prod.example .env.prod     # si completeaza valorile
#   docker compose up -d --build

services:
  pfasimplu-app:
    container_name: pfasimplu-app
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env.prod
    volumes:
      - ./data/dbsqlite:/data/dbsqlite
      - ./data/media:/data/media
      - ./staticfiles:/app/staticfiles
    networks:
      - web

networks:
  web:
    external: true
